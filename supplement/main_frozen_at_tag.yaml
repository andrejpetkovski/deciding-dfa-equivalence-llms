serving:
  management: openrouter
  direct_hosting_required: false
  infrastructure_evidence: 'docs/freeze_log.md D6-D10 and docs/provider_reprobe_20260909.json. One provider pinned per model with allow_fallbacks:false; every response records provider, returned model and generation id. No hosting, weight access or GPU provisioning is claimed.'
