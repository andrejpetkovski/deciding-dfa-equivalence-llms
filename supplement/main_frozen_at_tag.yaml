  # requests return different generations). The repeats are an operational repeatability
  # audit, never a determinism check. seed/top_p are null because the providers ignore them.
  temperature: 0
  seed: null
  top_p: null
  # Frozen 2026-09-09 from calibration; the pilot truncated 9/235 (4%) at this cap.
  max_output_tokens: 12288
  guided_json: false
  final_answer_policy: openai_chat_content_v1
samples:
  main: 1
  repeatability:
    enabled: true
    fraction: 0.2
    stratified_by:
    - family
    - depth_bin
    extra_samples: 2
    selection_seed: 109702936
    mode: operational_repeatability_audit
execution:
  randomize_call_order: true
  order_seed: 1250801037
  # 4 is what the D8 probe exercised cleanly; raising it is an operational change,
  # not a protocol change, but it has not been load-tested above 4 on these pins.
  max_concurrent_requests: 4
  # Lowered 5 -> 2 on 2026-09-08. The observed 504s from the opencode-adapter upstream
  # arrive in sustained storms, not transient blips: every failed cell in calibration
  # exhausted all five attempts, so attempts 3-5 were reliably wasted at ~50s each.
  # Two attempts still cover a genuine one-off; the runner resumes for the rest.
  max_transport_attempts: 2
  backoff:
    initial_seconds: 2
    multiplier: 2.0
    max_seconds: 60
  request_timeout_seconds: 900
  raw_log: data/raw/main_v2_responses.jsonl
  # APPROVED 2026-09-09 by the repo owner, in session, against the printed estimate:
  # 3,360 logical calls, ceiling 6,720 attempts, ~$2.70. Recorded in docs/budget.md.
  # This flag alone does not start a run: --execute, --approved-attempts and a typed
  # confirmation are still required, by design.
  approval_status: APPROVED
  require_verified_v2_artifacts: true
grading:
  strict_parse_is_primary: true
  strict_parse_failures_count_as_wrong: true
  forgiving_parser_as_sensitivity: true
  valid_non_shortest_is_success: true
exclusions:
  transport_failure_after_max_attempts: count_as_end_to_end_failure_and_report_separately
  truncated_by_max_tokens: grade_retained_final_answer_and_report_truncation
  empty_response: report_as_parse_failure
qa:
  token_balance_tolerance: 0.1
  cross_check_libraries:
  - pyformlang
  - automata-lib
  tokenizer_for_token_balance: deepseek-ai/DeepSeek-V4-Flash-0731
  require_all_states_reachable: true
  token_balance_scope: full_model_input_per_model_and_prompt_condition
  require_prompt_artifact_integrity: true
analysis:
  cluster_key: pair_id
  primary_hypothesis: H1
  secondary_hypotheses:
  - H2
  - H3
  h1_model: logit P(witness_success) ~ d + prompt_centered + representation + model
    + d:prompt_centered, RE(pair_id)
  h1_restricted_to: NEQ_DEPTH
  bootstrap_resamples: 10000
  multiplicity_correction: holm
  primary_metric: end_to_end_witness_success
  h1_prompt_coding:
    P0: -0.5
    P1: 0.5
  h1_outcome: end_to_end_witness_success
  secondary_decision_metric: balanced_decision_accuracy
  primary_sample_index: 0
  h2_contrast_specification: 'Average marginal effect (AME) of P1 minus P0 on
    end-to-end valid-witness success, over ground-truth NEQ_DEPTH pairs at
    sample_index=0 only. Averaged over the realized depth distribution -- balanced at
    25 pairs per bin by construction, so no depth is privileged -- and over the three
    models, each of which contributes equally. Estimated from the H1 logistic model
    INCLUDING the d x prompt_centered interaction, so the reported effect is not the
    beta2 coefficient (which is the effect at d=0, a depth that does not exist in the
    design). Uncertainty: pair-clustered bootstrap, 10,000 resamples, percentile 95%
    CI, resampling whole pair_ids with all their representations, prompts and models
    kept together. Reported as absolute percentage points AND as an odds ratio.
    Separation handling: if any model x prompt cell is perfectly separated, refit that
    stratum with Firth penalized likelihood and label it in the table; never drop the
    cell, since perfect performance is a result.'
  secondary_test_family: 'Exactly two confirmatory secondary tests, Holm-corrected
    across the pair: (1) the H2 trace-prompt AME defined above; (2) the H3 R0/R1
    decision flip rate, McNemar within each model x prompt cell and pooled with a
    pair-cluster bootstrap. H1 beta1 is PRIMARY and reported uncorrected. Both raw and
    Holm-adjusted p-values are reported for the two secondaries. Everything else --
    balanced decision accuracy, trace correctness, per-family and per-model breakdowns,
    the 2x2 labels-vs-row-order follow-up, baseline comparisons and the error taxonomy
    -- is DESCRIPTIVE or EXPLORATORY, is labelled so in every table, and carries no
    confirmatory claim regardless of what it shows (rule 11).'
  baselines:
  - exact_oracle
  - always_equivalent
  - always_non_equivalent
  - accepting_count_difference_one
  shortestness_role: descriptive
  flip_denominator: both_strict_valid_boolean_decisions_report_coverage
  orbit_denominator: all_scheduled_representation_pairs
