    docs/calibration_20260909T104138Z.json (glm, mimo, pinned); D8 load probe in
    docs/freeze_log.md
  routing_policy: MUST pin one provider per model, allow_fallbacks false. OpenRouter
    routes across providers that differ in quantization, tokenizer and throughput; an
    unpinned run could cross a deployment boundary mid-schedule, which the protocol
    forbids pooling across. The three models sit on two hosts (Relace, GMICloud), so a
    model-to-model difference mixes developer with host to a small degree -- recorded in
    D8 and belongs in the paper.
  optional_ranking_headers_sent: false
  max_parallel_requests: 4
