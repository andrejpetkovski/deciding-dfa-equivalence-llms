  repeatability:
    enabled: false
    fraction: 0.2
    stratified_by:
    - family
    - depth_bin
    extra_samples: 2
    selection_seed: FILL_AT_FREEZE
    mode: operational_repeatability_audit
execution:
  randomize_call_order: true
  order_seed: 20260908
  max_concurrent_requests: 2
  max_transport_attempts: 2
  backoff:
    initial_seconds: 2
    multiplier: 2.0
    max_seconds: 60
  request_timeout_seconds: 900
  raw_log: data/raw/pilot_v2_openrouter_responses.jsonl
  approval_status: APPROVED
  require_verified_v2_artifacts: true
  concurrency_note: '2 as of 2026-09-09. The rate limit is DeepInfra''s, not the account''s:
    with mimo moved to GMICloud it ran 96/96 clean while deepseek and glm, which share
    DeepInfra, absorbed 62 429s at concurrency 6. Moving them to other providers would
    split one model''s cells across two deployments, so the fix is fewer concurrent
    requests, not a different host.'
grading:
  strict_parse_is_primary: true
  strict_parse_failures_count_as_wrong: true
  forgiving_parser_as_sensitivity: true
  valid_non_shortest_is_success: true
exclusions:
  transport_failure_after_max_attempts: count_as_end_to_end_failure_and_report_separately
  truncated_by_max_tokens: grade_retained_final_answer_and_report_truncation
  empty_response: report_as_parse_failure
qa:
  token_balance_tolerance: 0.1
  cross_check_libraries:
  - pyformlang
  - automata-lib
  tokenizer_for_token_balance: deepseek-ai/DeepSeek-V4-Flash-0731
  require_all_states_reachable: true
  token_balance_scope: full_model_input_per_model_and_prompt_condition
  require_prompt_artifact_integrity: true
  tokenizer_validation: 'Validated 2026-09-09 against DeepInfra''s own usage.prompt_tokens:
    local(system)+local(user)+4 reproduced the reported count EXACTLY on 12 of 16
    probe calls. The other 4 carried a constant +79 provider-side artefact that is
    not a property of the prompt -- the prompts are byte-identical in length and use
    one label vocabulary. The local tokenizer is therefore the sound instrument and
    usage.prompt_tokens is not.'
analysis:
  cluster_key: pair_id
  primary_hypothesis: H1
  secondary_hypotheses:
  - H2
  - H3
  h1_model: logit P(witness_success) ~ d + prompt_centered + representation + model
    + d:prompt_centered, RE(pair_id)
  h1_restricted_to: NEQ_DEPTH
  bootstrap_resamples: 10000
  multiplicity_correction: holm
  primary_metric: end_to_end_witness_success
  h1_prompt_coding:
    P0: -0.5
    P1: 0.5
  h1_outcome: end_to_end_witness_success
  secondary_decision_metric: balanced_decision_accuracy
  primary_sample_index: 0
  h2_contrast_specification: FILL_AT_FREEZE
  secondary_test_family: FILL_AT_FREEZE
  baselines:
  - exact_oracle
  - always_equivalent
  - always_non_equivalent
  - accepting_count_difference_one
  shortestness_role: descriptive
  flip_denominator: both_strict_valid_boolean_decisions_report_coverage
  orbit_denominator: all_scheduled_representation_pairs
paths:
  pairs_dir: data/pairs/pilot_v2
  renderings_dir: data/renderings/pilot_v2
  parsed_dir: data/parsed/pilot_v2_openrouter
  tables_dir: analysis/tables/pilot_v2_openrouter
  figures_dir: analysis/figures/pilot_v2_openrouter
implementation_status: M3R_CODE_PRESENT_PILOT_ARTIFACTS_AND_M5R_M6R_M7_M8_M9_PENDING
