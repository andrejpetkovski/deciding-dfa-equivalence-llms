  neq_depth:
    count: 12
    state_count: 14
    bins:
      1-2: 3
      3-4: 3
      5-8: 3
      9-12: 3
    exclude_depth_zero: true
    forbid_epsilon_cue: true
  eq_iso:
    count: 6
    state_count: 14
  eq_expand:
    count: 6
    state_count: 14
    core_states:
    - 10
    - 12
    require_non_isomorphic: true
  max_generation_attempts_per_pair: 20000
  exclude_hashes_from: data/pairs/pilot_v2/exclusion_hashes_from_legacy.txt
  exclusion_sources:
