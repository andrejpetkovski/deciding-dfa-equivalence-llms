# OpenRouter execution environment (D6). NOT FROZEN, NOT APPROVED.
#
# SAME DATASET as configs/pilot_revised.yaml -- identical pairs, renderings and prompts, so
# pairs_dir and renderings_dir are unchanged. Only the execution environment differs, which
# is precisely why this is a separate config: a different deployment is a version boundary
# and its responses must not be pooled with the FINKI run's.
#
# Everything marked FILL_AFTER_PROBE is deliberately unset. The wire format, the effective
# controls and the provider pin are measured, never assumed -- the same discipline that
# caught max_tokens being inert and temperature=0 being ineffective on FINKI.
#
# PROVIDER PINNED 2026-09-09. The first, unpinned probe was routed across ELEVEN providers in
# twenty-five calls -- the identical repeated prompt hit five of them, reporting 779/779/722/
# 779/700 prompt tokens and 6.9s-238s latency. Different hosts, different quantization,
# different tokenizers. Unpinned, this study would pool results across deployments, which the
# protocol forbids, and gate 8 would be measuring the routing rather than the renderings.
# allow_fallbacks is false on purpose: a silent failover is exactly the boundary we are
# preventing, so a provider outage must surface as a transport error the runner can retry.
#
# THREE MODELS, ONE SERVING STACK (user decision 2026-09-09, recorded as D7).
# DeepSeek V4 Flash 0731 / Z.ai GLM 5.3 Flash / Xiaomi MiMo-V2.5 -- three distinct
# developers, three official open-weight releases, all three served by DeepInfra.
#
# Pinning one provider for all three is not a cost or speed choice. It holds the SERVING
# STACK CONSTANT across the model comparison: same host, same accounting, same quantization
# policy. Every earlier configuration confounded developer with deployment -- FINKI ran two
# models on opencode-adapter and one on an Ollama box. This does not.
config_id: pilot_v2_openrouter
dataset_id: pilot_v2
status: TEMPLATE
study_title: Do LLMs Understand DFA Equivalence?
protocol_version: v2-amendments-2026-09-07
frozen_commit: FILL_AT_FREEZE
frozen_at_utc: FILL_AT_FREEZE
seed: 20260908
alphabet:
- '0'
- '1'
pairs:
